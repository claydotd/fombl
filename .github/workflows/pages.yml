# Phase 1. Builds the design prototype and publishes it to GitHub Pages.
# This does not change fombl.org.uk.
#
# One-time setup: in the GitHub repo, Settings → Pages → Build and deployment
# → Source: GitHub Actions.
#
# Project sites are served from /<repository-name>/. To publish at the root of
# a user site (<name>.github.io), set the repository variable PAGES_BASE_PATH to /.

name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the Pages base path
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          # Project Pages for this repo are served under /fombl/.
          # Override with repository variable PAGES_BASE_PATH if needed (e.g. / for a user site).
          if [ -n "$PAGES_BASE_PATH" ]; then
            echo "VITE_BASE_PATH=$PAGES_BASE_PATH" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/fombl/" >> "$GITHUB_ENV"
          fi
          echo "VITE_SITE_PHASE=prototype" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
