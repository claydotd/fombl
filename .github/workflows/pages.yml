# Publishes Decap CMS only to GitHub Pages (no site prototype).
# Served at https://analoguegonedigital.co.uk/fombl/ (and claydotd.github.io/fombl/).
#
# One-time setup: in the GitHub repo, Settings → Pages → Build and deployment
# → Source: GitHub Actions.

name: Deploy Decap CMS to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'public/admin/**'
      - 'public/FomblLogo.jpg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble CMS-only Pages site
        run: |
          mkdir -p site/admin
          cp public/admin/index.html site/index.html
          cp public/admin/config.yml site/config.yml
          cp public/admin/FomblLogo.jpg site/FomblLogo.jpg
          # Also keep /admin/ so old bookmarks still work.
          cp public/admin/index.html site/admin/index.html
          cp public/admin/config.yml site/admin/config.yml
          cp public/admin/FomblLogo.jpg site/admin/FomblLogo.jpg
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
