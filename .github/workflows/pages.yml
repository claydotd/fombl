# Redirects https://analoguegonedigital.co.uk/fombl/ to the Decap CMS on agdforms.
# The CMS must run on the Netlify site origin or GitHub OAuth never finishes.
#
# One-time setup: in the GitHub repo, Settings → Pages → Build and deployment
# → Source: GitHub Actions.

name: Deploy CMS redirect to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Assemble redirect site
        run: |
          mkdir -p site/admin
          CMS_URL='https://agdforms.netlify.app/fombl-cms/'
          python3 - <<'PY'
          from pathlib import Path
          url = "https://agdforms.netlify.app/fombl-cms/"
          html = f"""<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="robots" content="noindex" />
              <meta http-equiv="refresh" content="0;url={url}" />
              <link rel="canonical" href="{url}" />
              <title>FoMBL content admin</title>
              <script>location.replace({url!r})</script>
            </head>
            <body>
              <p><a href="{url}">Continue to FoMBL content admin</a></p>
            </body>
          </html>
          """
          # Drop the common leading indent from the template above.
          lines = []
          for line in html.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          text = "\n".join(lines) + "\n"
          Path("site/index.html").write_text(text)
          Path("site/admin/index.html").write_text(text)
          Path("site/.nojekyll").write_text("")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
